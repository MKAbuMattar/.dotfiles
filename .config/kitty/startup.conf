# ============================================================================
# STARTUP LAYOUT CONFIGURATION
# ============================================================================
# This file defines the initial window layout when kitty starts up.
# Enable in kitty.conf with: startup_session startup.conf
#
# Layout description:
# - Tab 1: Split layout with main terminal
# ============================================================================

# First tab with split layout
new_tab
layout splits

# 1. Opens the first terminal (The main left pane target)
launch

# # 2. Splits the current window vertically, putting the new one on the right.
# #    The focus is now on the new, right pane.
# launch --location=vsplit

# # 3. CRITICAL: Move focus back to the left pane (Window 1)
# focus left
