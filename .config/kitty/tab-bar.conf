# ============================================================================
# TAB BAR STYLING (Night Owl Theme)
# ============================================================================

# Tab bar position and style
tab_bar_edge bottom
tab_bar_background #011627
tab_bar_style powerline
tab_powerline_style slanted

# Tab titles
tab_title_template "{fmt.fg.d6deeb}{title}"

active_tab_title_template "{fmt.fg.d6deeb}{title}"
active_tab_foreground #d6deeb
active_tab_font_style bold-italic
active_tab_background #1d3b53

inactive_tab_foreground #575656
inactive_tab_background #011627